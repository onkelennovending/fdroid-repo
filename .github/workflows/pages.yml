name: Deploy Pages

# The kiosk update rail depends on this site: the in-house updater (#302) reads
# repo/release-manifest.json from GitHub Pages and installs what it advertises.
#
# Until 2026-08-11 Pages used the LEGACY branch builder, which clones the entire
# repository. fdroid-repo carries ~2.1 GB of history (every ~30 MB APK revision
# ever committed), and that build had been failing since 2026-08-06 11:51Z. Pages
# kept serving the last good snapshot — the vc241 manifest — while the vending CI
# reported success on vc242/243/244. The whole kiosk fleet silently stopped
# updating for five days and nothing anywhere said so.
#
# This workflow publishes the ~76 MB working tree and never touches history
# (fetch-depth: 1), so site size is what is actually served, not what was ever
# committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy twice at once, and never cancel one mid-publish: a half-published
# index hands the fleet a manifest whose APK 404s.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (shallow — history is the thing that broke the legacy build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact tars the path excluding .git and .github.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The publisher (vending/health/updater CI) asserts this itself, but assert
      # here too: this is the job that can actually fail the deployment, and a
      # served manifest that still names the old versionCode means the fleet is
      # about to sit on a stale build without noticing.
      - name: Verify the served manifest matches the committed one
        run: |
          set -euo pipefail
          BASE="https://onkelennovending.github.io/fdroid-repo/repo"
          COMMITTED=$(jq -r .versionCode repo/release-manifest.json)
          echo "committed versionCode=$COMMITTED"
          for i in $(seq 1 12); do
            SERVED=$(curl -fsS --max-time 20 "$BASE/release-manifest.json" | jq -r .versionCode || echo "fetch-failed")
            echo "attempt $i: served versionCode=$SERVED"
            if [ "$SERVED" = "$COMMITTED" ]; then
              echo "Pages is serving versionCode $SERVED"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages still serves versionCode $SERVED after deploy (committed $COMMITTED) — the kiosk fleet will NOT update."
          exit 1
